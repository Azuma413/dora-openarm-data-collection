# View and controller-pose settings read by the webxr node through
# VIEW_CONFIGURATION_FILE in modules/leader-webxr.yaml. The format is the
# patched node's (nodes/dora-openarm-webxr/PATCHES.md).

# none: passthrough and the HUD only (the real robot is in the room).
# mono: one head camera on a panel, e.g. for ROBOT=mujoco; also wire
#       camera_head_right in modules/leader-webxr.yaml (it already is).
# stereo: both head cameras, head-locked, immersive-vr.
view: none

session:
  # immersive-ar shows the room and the real controllers around the view.
  mode: immersive-ar

panel:
  # room: the panel stays where the head pointed at session start.
  lock: room
  distance: 1.3
  width: 1.5

pose:
  # Neutral hand position relative to the robot's arm_origin site, in meters.
  # The clutch only uses the hand's displacement while the grip is squeezed,
  # so this does not move the robot; it only centres the raw pose output.
  frame_offset: [-0.1, 0.0, 0.23]

  # Eyes to the neck's rotation axis, in headset coordinates (+Y up, -Z
  # forward). PIVOT_MODE=latched (modules/leader-webxr.yaml) fixes the pivot
  # per session, so leaning in or turning the head does not move an arm.
  # No `pose.mode: relative` here: re-expressing the hands in the headset
  # frame every frame would move an engaged arm whenever the head turns.
  neck_pivot_offset: [0.0, -0.075, 0.080]
