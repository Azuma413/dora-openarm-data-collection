# For ROBOT=mujoco: the simulated head camera on a panel over passthrough, so
# the room and your controllers stay visible around it. Pick it with
# WEBXR_VIEW=view-webxr-sim.yaml. view-webxr.yaml (no camera) is for a robot in
# the room.

view: mono

session:
  mode: immersive-ar

panel:
  # room: the panel stays where the head pointed at session start.
  lock: room
  distance: 1.3
  width: 1.5

pose:
  # Same as view-webxr.yaml: the clutch uses only the hand's displacement.
  frame_offset: [-0.1, 0.0, 0.23]
  neck_pivot_offset: [0.0, -0.075, 0.080]
