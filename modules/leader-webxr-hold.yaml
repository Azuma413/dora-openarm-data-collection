# LEADER=webxr-hold: LEADER=webxr with the left arm held at fixed joint
# angles. The right controller drives the right arm through IK as in
# leader-webxr.yaml; the left trigger still works the left gripper, and pulling
# it is what starts the left arm aligning to the held posture.
# See leader-ker.yaml for the common inputs and outputs.
module:
  name: leader-webxr-hold
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

# Env paths are relative to dataflow.yaml's directory.
nodes:
  - id: webxr
    path: ../dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "nodes/dora-openarm-webxr/example/server.crt"
      TLS_KEY_FILE: "nodes/dora-openarm-webxr/example/server.key"
      VIEW_CONFIGURATION_FILE: "view-webxr.yaml"
      # Clutch: an arm follows its hand only while that grip is squeezed, by
      # the hand's motion since the squeeze; let go to hold the arm and
      # reposition the hand. The first squeeze snaps to the absolute target.
      CLUTCH: "true"
      # Robot motion per hand motion while clutched; below 1 for finer work.
      POSITION_SCALE: "0.5"
      ROTATION_SCALE: "1.0"
      # The left arm's joints 1-7 in radians, the same values as the MuJoCo
      # viewer's Control sliders (left_joint1_ctrl ... left_joint7_ctrl).
      HOLD_JOINTS_LEFT: "-1.66,-0.157,1.57,0.293,0.157,-0.22,-1.08"
    inputs:
      # WebXR stops when all its inputs are closed on Quit.
      tick: _mod/tick
      # The head camera view in the headset; see view-webxr.yaml.
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_head_right:
        source: _mod/camera_head_right
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference
      - hold_position_left

  - id: ik
    path: ../dora-openarm-ik
    args: >-
      --mode right --tick-hz 250
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
      --frame-position-error-limit 0.001
      --frame-orientation-error-limit 0.004
      --nullspace-cost 5.0                                                         
      --nullspace-return-rate 2.0  

    inputs:
      target_right: webxr/pose_right
      trigger_right: webxr/trigger_right
    outputs:
      - position_right
      - position_left
      - status

  # Renames the outputs to the common `follower_position_*`: IK for the right
  # arm, the held joints for the left.
  - id: out
    path: ../dora-echo
    inputs:
      follower_position_right: ik/position_right
      follower_position_left: webxr/hold_position_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by WebXR.
      - ker_position
      - metadata
