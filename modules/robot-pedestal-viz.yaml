# ROBOT=pedestal-viz: robot-pedestal plus a MuJoCo viewer that mirrors the
# commands sent to the real arms, so the operator can watch a digital twin
# while teleoperating. The viewer never reports state: `state_*`,
# `arm_state_*` and `status_*` all come from the real arms, and the viewer
# only declares `status`, which is not a module output.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-pedestal-viz
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - camera_head_depth
    - camera_head_depth_preview
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: ../dora-openarm
    args: "--side right --align-trigger gripper --config openarm_pedestal"
    inputs:
      # Event ID is only used. Event value isn't used.
      # The quittable tick, not the position: the gate sends nothing until it
      # has seen a state, so tying the state to the command never starts.
      request_state: _mod/tick
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: ../dora-openarm
    args: "--side left --align-trigger gripper --config openarm_pedestal"
    inputs:
      request_state: _mod/tick
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  # Renames the followers' outputs to the common names.
  - id: arms
    path: ../dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      # Not sent by the pedestal.
      - elevation_action
      - elevation_observation

  # No cameras. Closes the camera outputs on Quit for a leader that waits
  # for them, e.g. WebXR.
  - id: quittable-cameras
    path: ../dora-openarm-quitter
    inputs:
      command: _mod/command
    outputs:
      # Not sent by the pedestal.
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
      - camera_head_depth
      - camera_head_depth_preview

  # Digital twin. Receives the same joint targets as the real arms and only
  # draws them, so `request_state` is deliberately not wired: the viewer must
  # not publish `state_*`, which would collide with `arms`.
  - id: viewer
    path: ../dora-openarm-mujoco
    args: "--scene cell --keyframe home --enable-collision --ctrl --viewer --no-render --debug-frames"
    inputs:
      move_position_right: quittable-viewer-controls/position_right
      move_position_left: quittable-viewer-controls/position_left
      pose_right: quittable-viewer-controls/pose_right
      pose_left: quittable-viewer-controls/pose_left
    outputs:
      - status

  # Closes the leader's inputs on Quit so that the viewer stops even if the
  # leader waits for its cameras, e.g. WebXR.
  - id: quittable-viewer-controls
    path: ../dora-openarm-quitter
    inputs:
      command: _mod/command
      position_right: _mod/position_right
      position_left: _mod/position_left
      pose_right: _mod/pose_right
      pose_left: _mod/pose_left
    outputs:
      - position_right
      - position_left
      - pose_right
      - pose_left
