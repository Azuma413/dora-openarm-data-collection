# ROBOT=pedestal-zed: robot-pedestal plus a ZED Mini on the head. Followers
# on CAN, no lifter; the ZED gives the head images and depth.
# See robot-cell.yaml for the common inputs and outputs.
module:
  name: robot-pedestal-zed
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - camera_head_depth
    - camera_head_depth_preview
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: ../dora-openarm
    args: "--side right --align-trigger gripper --config openarm_pedestal"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: _mod/position_right
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: ../dora-openarm
    args: "--side left --align-trigger gripper --config openarm_pedestal"
    inputs:
      request_state: _mod/position_left
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  # Renames the followers' outputs to the common names.
  - id: arms
    path: ../dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      # Not sent by the pedestal.
      - elevation_action
      - elevation_observation

  # ZED Mini on the head. One grab gives the rectified left and right images
  # and the depth of the same exposure; see nodes/dora-openarm-zed. It
  # depends only on `camera_tick`, so it stops by itself on Quit.
  - id: head-zed
    path: ../dora-openarm-zed
    env:
      # Please configure! 0 opens the first ZED camera.
      SERIAL_NUMBER: 0
      RESOLUTION: "HD720"
      FPS: 30
      DEPTH_MODE: "NEURAL"
      # The ZED Mini can't see closer than 100 mm.
      DEPTH_MINIMUM: 100
      DEPTH_MAXIMUM: 3000
      JPEG_QUALITY: 90
      # depth_preview for the UI at 10 fps.
      PREVIEW_EVERY: 3
      # Colors of depth_preview span DEPTH_MINIMUM to this, in mm.
      PREVIEW_MAXIMUM: 1500
    inputs:
      tick: _mod/camera_tick
    outputs:
      - image_left
      - image_right
      - depth
      - depth_preview

  # Renames the ZED's outputs to the common names. Stops on Quit with the
  # ZED because `camera_tick` is closed, which also closes the outputs that
  # are never sent.
  - id: cameras
    path: ../dora-echo
    inputs:
      camera_head_left: head-zed/image_left
      camera_head_right: head-zed/image_right
      camera_head_depth: head-zed/depth
      camera_head_depth_preview: head-zed/depth_preview
    outputs:
      - camera_head_left
      - camera_head_right
      - camera_head_depth
      - camera_head_depth_preview
      # Not sent by the pedestal.
      - camera_wrist_right
      - camera_wrist_left
      - camera_ceiling
