# LEADER=policy: the small flow policy (training/small_flow) drives both arms,
# conditioned on a bbox the operator drags on head_left in a browser
# (http://localhost:8010). No headset. Run it with scripts/policy.
#
#   clutch --target--> ik --position--> policy --position--> gate --cmd--> robot
#     ^                                   |  ^                 |
#     +---------- clutch_control ---------+  +----- cmd -------+
#
# Until Start is pressed in the browser, the policy node passes the IK's output
# through: the clutch runs the left arm's intro as in data collection (turn the
# finger on the right down, open, wait for "湿布を受け取った", close, turn the
# finger on the left down) and holds both arms. Then the policy's joint chunks
# go to the gate, which still enforces the joint ranges, speeds and jumps.
#
# The policy node runs from .venv-policy (CUDA torch), which scripts/policy-setup
# makes; see nodes/dora-openarm-policy/README.md.
module:
  name: leader-policy
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
    - camera_wrist_right
    - command
    - state_right
    - state_left
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  # As in leader-webxr.yaml, without hands: it runs the left arm's intro and
  # holds both arms (right gripper 60% open, left closed). Its control comes
  # through the policy node, which adds the browser's "proceed" and "cancel".
  - id: clutch
    path: ../dora-openarm-clutch
    args: --scene demo --tick-hz 250
    env:
      ROBOT: "${ROBOT:-dummy}"
      TABLE_Z: "${TABLE_Z:-}"
      INTRO_ARM: "${INTRO_ARM:-left}"
      INTRO_EVERY_EPISODE: "on"
      FIXED_GRIPPERS: "${FIXED_GRIPPERS:-right=0.6,left=0}"
      FINGER_DOWN: "none"
    inputs:
      tick: _mod/tick
      state_right: _mod/state_right
      state_left: _mod/state_left
      control: policy/clutch_control
    outputs:
      - target_right
      - target_left
      - clutch_state

  - id: ik
    path: ../dora-openarm-teleop-ik
    args: --tick-hz 250
    env:
      ROBOT: "${ROBOT:-dummy}"
    inputs:
      target_right:
        source: clutch/target_right
        queue_size: 10
      target_left:
        source: clutch/target_left
        queue_size: 10
    outputs:
      - position_right
      - position_left
      - status

  # Passes the IK through, or runs the policy. Serves the browser UI.
  - id: policy
    path: ../.venv-policy/bin/dora-openarm-policy
    env:
      # small_flow or molmoact2. Empty here means: .env's, else small_flow.
      POLICY: "${POLICY:-}"
      POLICY_CHECKPOINT: "${POLICY_CHECKPOINT:-training/small_flow/runs/flow40k_v3/step20000.pt}"
      MOLMOACT2_CHECKPOINT: "${MOLMOACT2_CHECKPOINT:-}"
      SMALL_FLOW_PY: "${SMALL_FLOW_PY:-training/small_flow/small_flow.py}"
      # Chunk steps (30 fps) run before the next chunk takes over (empty: 10 =
      # 0.33 s). This plus the inference time must stay under 30 steps.
      EXECUTE_STEPS: "${EXECUTE_STEPS:-}"
      FLOW_STEPS: "${FLOW_STEPS:-10}"
      # Seconds a new chunk is cross-faded in over (empty: 0.15, MolmoAct2 0.4).
      BLEND_S: "${BLEND_S:-}"
      # The flow's starting noise, the same for every chunk (empty: 0); "random"
      # draws it anew each time.
      POLICY_SEED: "${POLICY_SEED:-}"
      # Playback speed of the chunks, 0.05..1 (empty: 1, MolmoAct2 0.5). The UI's
      # slider changes it while running.
      POLICY_SPEED: "${POLICY_SPEED:-}"
      # rad/s for the joint that moves most when easing back to the clutch.
      RETURN_SPEED: "${RETURN_SPEED:-0.3}"
      POLICY_UI_PORT: "${POLICY_UI_PORT:-8010}"
      # The voice assistant. The OpenAI key comes from .env at the repository
      # root (see .env.example), never from here.
      PATCH_PRESETS: "${PATCH_PRESETS:-configs/patch_presets.yaml}"
      VLM_MODEL: "${VLM_MODEL:-gpt-6.2-sol}"
      STT_MODEL: "${STT_MODEL:-gpt-4o-transcribe}"
      TTS_MODEL: "${TTS_MODEL:-gpt-4o-mini-tts}"
      TTS_VOICE: "${TTS_VOICE:-alloy}"
    inputs:
      tick: _mod/tick
      ik_right: ik/position_right
      ik_left: ik/position_left
      cmd_right: gate/cmd_right
      cmd_left: gate/cmd_left
      state_right: _mod/state_right
      state_left: _mod/state_left
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_wrist_right:
        source: _mod/camera_wrist_right
        queue_size: 1
      command: _mod/command
      gate_state: gate/gate_state
      clutch_state: clutch/clutch_state
    outputs:
      - position_right
      - position_left
      - clutch_control

  - id: gate
    path: ../dora-openarm-gate
    env:
      ROBOT: "${ROBOT:-dummy}"
    inputs:
      tick: _mod/tick
      position_right: policy/position_right
      position_left: policy/position_left
      state_right: _mod/state_right
      state_left: _mod/state_left
      control: _mod/command
    outputs:
      - cmd_right
      - cmd_left
      - gate_state

  # Renames the gate's outputs to the common `follower_position_*`.
  - id: out
    path: ../dora-echo
    inputs:
      follower_position_right: gate/cmd_right
      follower_position_left: gate/cmd_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by the policy leader.
      - pose_right
      - pose_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times
      - ker_position
      - metadata
