[project]
name = "dora-openarm-zed"
version = "0.1.0"
authors = [{ name = "Enactic, Inc." }]
description = "dora-rs node to capture a ZED stereo camera and compute depth"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "dora-rs >= 0.5.0, <= 1.0.1",
  "numpy >= 2.0",
  "opencv-python-headless",
  "pyarrow",
  # Not on PyPI. The project that uses this node points it at the wheel that
  # matches the installed ZED SDK; see README.md.
  "pyzed ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
dora-openarm-zed = "dora_openarm_zed.main:main"

[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "UP"
]

[tool.ruff.lint.per-file-ignores]
"!src/**.py" = ["D"]
