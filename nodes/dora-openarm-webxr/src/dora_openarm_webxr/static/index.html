<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>

    <title>OpenArm VR teleoperation</title>
  </head>
  <body>
    <!--
      openarm-quest-teleop patch 17: the page's own log, sent back to the node.
      Two scripts, in this order and before ar.js, because the failures worth
      catching happen before any of the page's modules have run.

      The inline one is a classic script, so it runs at once rather than after
      the module graph is fetched: it catches an ar.js that will not parse or
      will not load at all, which no module can catch for itself. telemetry.js
      drains what it collected.
    -->
    <script>
      // Bounded, and handed over the moment telemetry.js takes charge: it
      // sets __oqtEarly to null after draining, and these stop collecting so
      // that nothing is recorded twice or grows without end.
      window.__oqtEarly = [];
      addEventListener(
        "error",
        (event) => {
          if (!window.__oqtEarly || window.__oqtEarly.length >= 16) return;
          window.__oqtEarly.push({
            message: event.message || String(event.type),
            file: event.filename,
            line: event.lineno,
            stack: event.error && event.error.stack,
            url: event.target && (event.target.src || event.target.href),
          });
        },
        true,
      );
      addEventListener("unhandledrejection", (event) => {
        if (!window.__oqtEarly || window.__oqtEarly.length >= 16) return;
        window.__oqtEarly.push({
          message: "unhandled rejection: " + event.reason,
          stack: event.reason && event.reason.stack,
        });
      });
    </script>
    <script type="module" src="telemetry.js"></script>
    <script type="module" src="ar.js"></script>
    <button id="start" style="width: 100%; margin-top: 10px;">Start</button>
    <pre id="log"></pre>
  </body>
</html>
